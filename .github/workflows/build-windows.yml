name: Build Windows installer

# Tự động đóng gói bộ cài PQLTNĐ-PDF cho Windows.
# Chạy mỗi khi có thay đổi được đẩy lên nhánh main, hoặc bấm tay trong tab Actions.
# Kết quả nằm ở mục Releases của repo (và trong phần Artifacts của lần chạy).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer (Setup + Portable)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          npm run desktop:dist 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(sed 's/\x1b\[[0-9;]*m//g; s/\r//g' build.log | grep -v '^dist/' | cut -c1-220 | tail -n 45 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build log (last 45 lines)::$msg"
            exit "$code"
          fi

      - name: List output
        shell: bash
        run: ls -la release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PQLTND-PDF-Windows
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PQLTNĐ-PDF - bản build ${{ github.run_number }}
          body: |
            Bộ cài PQLTNĐ-PDF cho Windows, tự động đóng gói từ commit ${{ github.sha }}.
            - `...-Setup.exe`: bản cài đặt.
            - `...-Portable.exe`: bản chạy thẳng, không cần cài.
          files: |
            release/*.exe
